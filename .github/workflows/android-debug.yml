name: android-debug

# Собирает отладочный APK без ключей подписи — чтобы проверить сборку
# в форке, где секретов для релизной подписи нет.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v5

      - name: Take every engine from its own build
        run: ./tools/get-cores.sh android

      - name: Build the debug APK
        run: ./gradlew --warning-mode all :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: zedsecure-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
